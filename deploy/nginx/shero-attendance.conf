# Shero Attendance — standalone Nginx server block.
# This is a NEW, separate file — it must be copied to its own path
# (e.g. /etc/nginx/sites-available/shero-attendance) and symlinked into
# sites-enabled. It does not edit, replace, or reference any existing
# site file (dst / kob-crm's configs are untouched).
#
# Replace REPLACE_WITH_CONFIRMED_DOMAIN before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_CONFIRMED_DOMAIN;

    # Serve the built frontend as static files.
    root /data/shero-attendance/frontend-dist;
    index index.html;

    # SPA fallback — all client routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API requests proxy to the backend, which listens on localhost only.
    location /api/ {
        proxy_pass http://127.0.0.1:4800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Leave attachment uploads, served by the backend's express.static handler.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    access_log /var/log/nginx/shero-attendance.access.log;
    error_log  /var/log/nginx/shero-attendance.error.log;
}

# After HTTPS is issued (e.g. certbot --nginx -d REPLACE_WITH_CONFIRMED_DOMAIN),
# certbot will add its own server block / redirect here automatically.
# Do not hand-manage TLS directives in this file ahead of that.
